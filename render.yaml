# Note (2026-11-21): the actual live services were created via individual
# render CLI/API calls, not by syncing this file as a Render "Blueprint" -
# the CLI had no non-interactive "apply blueprint" command available at the
# time of deploy. This file is kept as an accurate reference of the real,
# live configuration (not aspirational placeholders) and as a recipe for
# recreating the setup from scratch if ever needed - editing it does NOT
# automatically change the live services, since they aren't tracked as a
# Blueprint instance.

databases:
  - name: tavora-db
    plan: free
    databaseName: tavora
    user: tavora

services:
  - type: web
    name: tavora-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # V7 adds real Alembic migrations (backend/alembic/) - this runs any
    # pending migration before the app starts serving traffic, every
    # deploy, not just this one. Idempotent (alembic upgrade head is a
    # no-op once already at head), so safe to leave in permanently rather
    # than reverting it like the earlier one-off seeding-via-startCommand
    # trick (see docs/DECISIONS.md).
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tavora-db
          property: connectionString
      # Real deployed value - confirmed matches what's actually set on the
      # live service (2026-11-21). Render's Blueprint fromService only
      # returns private-network hostnames, never a public URL, and Blueprints
      # don't support variable interpolation (confirmed against Render's own
      # docs) - so this had to be set to the real value by hand once the
      # frontend's own deploy revealed its URL, not derived automatically.
      - key: CORS_ORIGINS
        value: https://tavora-frontend-2ldl.onrender.com
      # Secrets - not committed here (real values are set on the live
      # service directly, confirmed present). See backend/.env for the exact
      # names this app reads and where to get real test credentials from.
      - key: SABRE_BASE_URL
        sync: false
      - key: SABRE_TOKEN_URL
        sync: false
      - key: SABRE_USER_ID
        sync: false
      - key: SABRE_PASSWORD
        sync: false
      - key: SABRE_PCC
        sync: false
      - key: HOTELBEDS_BASE_URL
        sync: false
      - key: HOTELBEDS_HOTEL_API_KEY
        sync: false
      - key: HOTELBEDS_HOTEL_SECRET
        sync: false

  - type: web
    name: tavora-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Real deployed value, same reasoning as CORS_ORIGINS above. Baked into
      # the JS bundle at build time - changing this requires a rebuild, not
      # just a restart.
      - key: VITE_API_BASE_URL
        value: https://tavora-backend-fm0b.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
